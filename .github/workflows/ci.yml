# Typy, formatowanie i testy (Chromium + Firefox) przy każdym pushu i pull requeście.
# Pomiar wydajności (`npm run perf`) sam się tu pomija – progi są dla komputera użytkownika (zmienna CI).
name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
