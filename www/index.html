<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#2f6fed" />
    <link rel="icon" href="icon-192.png" />
    <title>mindme</title>
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="top">
      <div id="tl" class="island" role="toolbar" aria-label="Menu i historia">
        <button id="bm" data-ic="menu" data-tip="Menu: plik, eksport, tryb jasny / ciemny, pomoc"></button>
        <span class="sep"></span>
        <button id="bu" data-ic="undo" data-tip="Cofnij (Ctrl+Z, u)"></button>
        <button id="br" data-ic="redo" data-tip="Ponów (Ctrl+Shift+Z, Ctrl+R)"></button>
        <button id="bf" data-ic="fit" data-tip="Dopasuj całą mapę (Shift+1, =)"></button>
      </div>
      <div id="srW" role="search">
        <div id="srBox" class="island">
          <button id="srBack" type="button" data-ic="back" data-tip="Wróć do mapy"></button>
          <span id="srIc"></span>
          <input
            id="sr"
            role="combobox"
            aria-controls="srL"
            aria-expanded="false"
            aria-autocomplete="list"
            aria-label="Szukaj w mapie lub wpisz polecenie"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            enterkeyhint="go"
            placeholder="Szukaj w mapie lub wpisz polecenie…"
          />
          <kbd id="srK">Ctrl+K</kbd>
        </div>
        <div id="srRes" class="island" hidden>
          <div id="srT" hidden></div>
          <div id="srL" role="listbox" aria-label="Węzły i polecenia"></div>
        </div>
      </div>
      <div id="tr">
        <div id="views" class="island" role="group" aria-label="Widok">
          <button id="bv" class="tr" data-ic="map" data-lbl="Mapa" data-tip="Mapa (Esc w widoku .md)"></button>
          <button id="bt" class="tr" data-ic="text" data-lbl=".md" data-tip="Tekst Markdown (:text)"></button>
        </div>
        <div class="island">
          <button
            id="srBtn"
            class="tr"
            data-ic="search"
            data-tip="Szukaj w mapie lub wpisz polecenie (Ctrl+K)"
          ></button>
          <button id="bp" class="tr" data-tip="Wygląd mapy: tekst, linie, węzły, odstępy, kolory">Aa</button>
        </div>
      </div>
    </div>
    <div id="mdBar" class="island" role="toolbar" aria-label="Edycja Markdown"></div>
    <div id="mdFind" class="island" role="search" hidden>
      <input
        id="mdQ"
        type="text"
        placeholder="Szukaj w tekście…"
        aria-label="Szukaj w tekście"
        autocomplete="off"
        enterkeyhint="next"
        spellcheck="false"
      />
      <span id="mdQn" aria-live="polite"></span>
      <button id="mdQx" type="button" aria-label="Zamknij szukanie (Esc)" title="Zamknij szukanie (Esc)"></button>
    </div>
    <div id="main">
      <svg id="sv"><g id="g"></g></svg>
      <div id="mdHl" aria-hidden="true"></div>
      <textarea id="txt" spellcheck="false"></textarea
      ><textarea id="ed" rows="1" spellcheck="false" enterkeyhint="next"></textarea>
      <div id="help"></div>
      <aside id="side" aria-label="Wygląd mapy"></aside>
      <div id="nbar" class="island" role="toolbar" aria-label="Pasek przy węźle" hidden></div>
      <button class="plus" data-k="child" type="button" hidden></button
      ><button class="plus" data-k="child" type="button" hidden></button
      ><button class="plus" data-k="sib" type="button" hidden></button>
      <button id="edemo" type="button" title="Wstaw emoji (Ctrl+.)" aria-label="Wstaw emoji">😊</button>
      <div id="wk"></div>
    </div>
    <div id="st">
      <span id="mode">NORMAL</span><span id="info"></span><span id="hint"></span><span id="save"></span>
    </div>
    <div id="menu" role="menu"></div>
    <div id="emo" role="dialog" aria-label="Wybór emoji"></div>
    <textarea id="clip" tabindex="-1" aria-hidden="true"></textarea>
    <dialog id="ask" aria-labelledby="askt">
      <p id="askt"></p>
      <textarea id="askf" rows="3" aria-labelledby="askt"></textarea>
      <div id="askb"></div>
    </dialog>
    <!-- skrypty zwykłe (nie moduły): dzielą jeden zakres globalny; kolejność ma znaczenie -->
    <script src="js/core.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/render.js"></script>
    <script src="js/edit.js"></script>
    <script src="js/ops.js"></script>
    <script src="js/emoji.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/keys.js"></script>
    <script src="js/files.js"></script>
    <script src="js/mdbar.js"></script>
    <script src="js/actions.js"></script>
    <script src="js/palette.js"></script>
    <script src="js/whichkey.js"></script>
    <script src="js/help.js"></script>
    <script src="js/side.js"></script>
    <script src="js/dnd.js"></script>
    <script src="js/pointer.js"></script>
    <script src="js/nodebar.js"></script>
    <script src="js/main.js"></script>
    <script>
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>
  </body>
</html>
