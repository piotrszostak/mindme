<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2f6fed"><link rel="icon" href="icon-192.png"><title>Mapa myśli</title>
<style>
:root{--bg:#fafaf7;--fg:#222;--card:#fff;--line:#bbb;--bar:#eceae3;--acc:#2f6fed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1c1f;--fg:#e8e8e8;--card:#2a2c31;--line:#555;--bar:#26282c;--acc:#7aa2ff}}
:root[data-theme="dark"]{--bg:#1b1c1f;--fg:#e8e8e8;--card:#2a2c31;--line:#555;--bar:#26282c;--acc:#7aa2ff}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;display:flex;flex-direction:column}
button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}button:disabled{opacity:.35;cursor:default}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#top{display:flex;gap:4px;padding:6px;background:var(--bar);align-items:center}
#top button{width:36px;height:36px;padding:0;display:grid;place-items:center}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
/* objaśnienia na hover (natychmiast czytelne, bez czekania na natywny title) */
[data-tip]{position:relative}
@media (hover:hover){[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:0;background:var(--fg);color:var(--bg);padding:4px 8px;border-radius:6px;font:12px system-ui,sans-serif;white-space:nowrap;pointer-events:none;z-index:40;animation:tip .12s .35s both}
 [data-tip].tr:hover::after{left:auto;right:0}}
@keyframes tip{from{opacity:0}to{opacity:1}}
#main{flex:1;position:relative;min-height:0;overflow:hidden}
svg{width:100%;height:100%;touch-action:none;display:block;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#txt{position:absolute;inset:0;width:100%;height:100%;box-sizing:border-box;background:var(--bg);color:var(--fg);border:0;padding:12px;font:14px ui-monospace,monospace;display:none}
/* edycja w węźle: textarea dokładnie na prostokącie węzła */
#ed{position:absolute;display:none;margin:0;box-sizing:border-box;border:2px solid var(--acc);border-radius:8px;background:var(--card);color:var(--fg);font-family:system-ui,sans-serif;resize:none;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;outline:none;z-index:4}
#st{display:flex;gap:10px;padding:6px 10px;background:var(--bar);align-items:center;font-family:ui-monospace,monospace;min-height:22px}
#mode{font-weight:700;color:var(--acc);min-width:64px}
#cmd{flex:1;display:none;font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);padding:2px 6px}
#save{white-space:nowrap}
#info{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hint{opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:system-ui,sans-serif;font-size:12px}
/* pomoc: na komputerze panel na dolnej połowie, na telefonie pełny ekran */
#help{position:absolute;left:0;right:0;bottom:0;height:50%;display:none;flex-direction:column;background:var(--card);color:var(--fg);border-top:1px solid var(--line);box-shadow:0 -8px 24px #0003;z-index:5;font:14px/1.45 system-ui,sans-serif}
#help.open{display:flex}
#help .hh{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 16px;border-bottom:1px solid var(--line);flex:none}
#help .hh b{font-size:15px;flex:1}#help .hh span{opacity:.6;font-size:12px}
#help .hh button{width:36px;height:36px;padding:0;display:grid;place-items:center}
#help .hb{overflow:auto;padding:4px 16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:4px 32px;align-items:start}
#help h3{margin:12px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--acc)}
#help dl{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:5px 14px;margin:0}
#help dt{text-align:right}#help dd{margin:0}
#help kbd{display:inline-block;font:12px/1.5 ui-monospace,monospace;background:var(--bar);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;margin:1px 0;white-space:nowrap}
@media (max-width:700px),(hover:none){
 #help{top:0;height:auto;border-top:0;font-size:16px}
 #help .hh{padding:8px 8px 8px 16px}#help .hh b{font-size:18px}#help .hh span{display:none}#help .hh button{width:44px;height:44px}
 #help .hb{grid-template-columns:1fr;padding:0 16px 32px}
 #help h3{font-size:13px;margin:20px 0 8px}
 #help dl{grid-template-columns:1fr;gap:0}#help dt{text-align:left;margin-top:10px}#help dd{opacity:.85}
 #help kbd{font-size:14px;padding:1px 7px}}
#menu{position:fixed;display:none;z-index:30;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px #0004;padding:4px;min-width:200px}
#menu .row{display:flex;gap:2px;padding:4px 0 0;margin-top:4px;border-top:1px solid var(--line)}
#menu .mh{box-sizing:border-box;width:0;min-width:100%;padding:3px 8px 6px;margin-bottom:4px;border-bottom:1px solid var(--line);font-size:12px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menu .row button{flex:1;min-width:44px;height:42px;padding:0 4px;border:0;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#menu .row small{font-size:10px;opacity:.8;white-space:nowrap}
#menu .row button.on{color:var(--acc);background:var(--bar)}
#menu .mi{display:flex;align-items:center;gap:10px;width:100%;border:0;padding:6px 8px;border-radius:6px;text-align:left;white-space:nowrap}
#menu kbd{margin-left:auto;padding-left:16px;opacity:.55;font:12px ui-monospace,monospace}
#menu button:not(:disabled):hover,#menu button:focus-visible{background:var(--bar);outline:none}
#menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
@media (hover:none){#menu .row button{height:48px}#menu .mi{padding:11px 10px}#menu kbd{display:none}#top button{width:42px;height:42px}}
.n{cursor:pointer}.n rect{fill:var(--card);stroke-width:var(--nb,2)}.n.sel rect{fill:var(--acc);fill-opacity:.2;stroke-width:calc(var(--nb,2) + 1)}
.n text{fill:var(--fg);font-size:var(--fs,14px);font-family:var(--ff,system-ui,sans-serif);font-weight:var(--fw,normal);dominant-baseline:central}
/* panel „Wygląd mapy” wysuwany z prawej */
#side{position:absolute;top:0;right:0;bottom:0;width:300px;max-width:100%;box-sizing:border-box;background:var(--card);color:var(--fg);border-left:1px solid var(--line);box-shadow:-8px 0 24px #0003;z-index:6;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s ease;visibility:hidden}
#side.open{transform:none;visibility:visible}
#side .hh{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 16px;border-bottom:1px solid var(--line)}#side .hh b{flex:1;font-size:15px}
#side .hh button{width:36px;height:36px;padding:0;display:grid;place-items:center}
#side .sb{overflow:auto;padding:4px 16px 20px}
#side h3{margin:16px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--acc)}
#side label{display:block;margin:10px 0 2px;font-size:13px}#side label output{float:right;opacity:.7;font:12px ui-monospace,monospace}
#side input[type=range]{width:100%;accent-color:var(--acc);margin:4px 0}
#side .seg{display:flex;gap:4px;margin-top:4px}#side .seg button{flex:1;padding:6px 4px;font-size:13px}
#side .seg button.on{border-color:var(--acc);color:var(--acc);background:var(--bar)}
#side .cols{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
#side .seg.fonts{display:grid;grid-template-columns:1fr 1fr}#side .seg.fonts button{font-size:14px}
#side .pals{display:grid;grid-template-columns:1fr 1fr;gap:6px}#side .pals button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:6px 8px;font-size:12px;text-align:left}
#side .pals button.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
#side .sw{display:flex;gap:3px}#side .sw i{width:14px;height:14px;border-radius:50%;display:inline-block}
#emo{position:fixed;display:none;z-index:31;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px #0004;width:min(340px,calc(100vw - 16px));padding:6px;box-sizing:border-box}
#emo.open{display:block}
#emo .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding-bottom:4px}
#emo .tabs button{flex:1;padding:4px 0;border:0;font-size:18px;background:none;border-radius:6px}#emo .tabs button.on{background:var(--bar)}
#emo .cap{font-size:11px;opacity:.6;padding:4px 4px 2px}
#emo .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:216px;overflow:auto}
#emo .grid button{border:0;background:none;font-size:22px;padding:4px 0;border-radius:6px;line-height:1.25}#emo .grid button:hover{background:var(--bar)}
#edemo{position:absolute;display:none;z-index:5;width:30px;height:30px;padding:0;border-radius:50%;font-size:16px;line-height:1;box-shadow:0 2px 6px #0003}
@media (hover:none){#emo .grid button{font-size:26px;padding:6px 0}#edemo{width:38px;height:38px;font-size:20px}}
#side .wide{width:100%;margin-top:8px;text-align:left}
#side input[type=color]{width:100%;height:34px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
#side .reset{width:100%;margin-top:20px}
@media (max-width:700px){#side{width:100%;border-left:0}#side .hh b{font-size:18px}#side .hh button{width:44px;height:44px}#side label{font-size:15px}#side .seg button{padding:10px 4px}}
.n.ed text{visibility:hidden}
.n .emo,#emo button,#edemo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-weight:normal}
.n.ph,.n.leave{pointer-events:none}.n.ph rect{fill:var(--acc);fill-opacity:.08;stroke-dasharray:5 4;stroke-width:2}
.n.dragging{pointer-events:none;opacity:.82;filter:drop-shadow(0 6px 10px #0005)}
.n.target rect{stroke-width:4;fill:var(--acc);fill-opacity:.12}
path.band{stroke-dasharray:7 5;stroke-width:2.5}path.phe{opacity:.45;stroke-dasharray:4 4}
svg.dnd{cursor:grabbing}
#top button.on{color:var(--acc);border-color:var(--acc)}
</style></head><body>
<div id="top">
 <button id="bm" data-ic="more" data-tip="Menu: otwórz, zapisz, nowa mapa, eksport, motyw, pomoc"></button>
 <span class="sep"></span>
 <button id="bu" data-ic="undo" data-tip="Cofnij (Ctrl+Z, u)"></button>
 <button id="br" data-ic="redo" data-tip="Ponów (Ctrl+Y, Ctrl+R)"></button>
 <span class="sep"></span>
 <button id="bl" data-ic="lright" data-tip="Układ mapy"></button>
 <button id="bf" data-ic="fit" data-tip="Dopasuj widok do ekranu (=)"></button>
 <span class="sep"></span>
 <button id="bt" data-ic="text" data-tip="Edytuj jako tekst Markdown (:text)"></button>
 <span style="flex:1"></span>
 <button id="bp" class="tr" data-ic="sliders" data-tip="Wygląd mapy: tekst, linie, węzły, odstępy, kolory"></button>
</div>
<div id="main"><svg id="sv"><g id="g"></g></svg><textarea id="txt" spellcheck="false"></textarea><textarea id="ed" rows="1" spellcheck="false" enterkeyhint="next"></textarea><div id="help"></div><aside id="side" aria-label="Wygląd mapy"></aside><button id="edemo" type="button" title="Wstaw emoji (Ctrl+.)" aria-label="Wstaw emoji">😊</button></div>
<div id="st"><span id="mode">NORMAL</span><input id="cmd"><span id="info"></span><span id="hint"></span><span id="save"></span></div>
<div id="menu" role="menu"></div><div id="emo" role="dialog" aria-label="Wybór emoji"></div>
<script>
const $=s=>document.getElementById(s);
const DEF={font:'system',weight:'normal',palette:'Domyślna',edge:2,edgeStyle:'curve',nb:2,radius:8,fill:'none',fs:14,maxw:220,gapX:50,gapY:10,gapTree:60,colors:['#e4572e','#2f9e44','#2f6fed','#c2185b','#f08c00','#0b7285']};
let ST=JSON.parse(JSON.stringify(DEF)),stDirty=true;
/* czcionki systemowe (bez pobierania – działa offline); każda z zapasowymi krojami */
const FONTS={system:['Systemowa','system-ui,sans-serif'],serif:['Szeryfowa','Georgia,"Times New Roman","DejaVu Serif",serif'],
 mono:['Maszynowa','ui-monospace,"Cascadia Code","DejaVu Sans Mono",monospace'],round:['Zaokrąglona','ui-rounded,"SF Pro Rounded",Nunito,Quicksand,"Varela Round",system-ui,sans-serif'],
 hand:['Odręczna','"Comic Neue","Comic Sans MS","Segoe Print","Bradley Hand",cursive'],narrow:['Wąska','"Arial Narrow","Roboto Condensed","Liberation Sans Narrow",sans-serif-condensed,sans-serif']};
/* emoji zawsze z kolorowej czcionki systemu – ta sama kolejność w pomiarze (canvas) i w SVG */
const EMOJI_FONTS='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif',EMOJI_FF=',"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji"';
const ff=()=>(FONTS[ST.font]||FONTS.system)[1]+EMOJI_FF,fw=()=>ST.weight==='bold'?'bold':'normal';
/* tylko różnice względem domyślnych trafiają do pliku */
function styleStr(){const o={};for(const k in DEF)if(JSON.stringify(ST[k])!==JSON.stringify(DEF[k]))o[k]=ST[k];return Object.keys(o).length?JSON.stringify(o):''}
var dir='right';let uid=0;const mk=(t,ch=[])=>({id:++uid,text:t,children:ch,collapsed:false});
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---- model, parser, serializer ---- */
/* model: `root` to niewidoczny kontener (id 0); jego dzieci to korzenie map – każdy zapisany jako osobny nagłówek „# …” */
const forest=ch=>({id:0,text:'',children:ch,collapsed:false,top:true});
const C_RE=/\s*<!--c-->\s*$/;
function serialize(t){return t.children.map((r,i)=>{let o='# '+r.text+(r.collapsed&&r.children.length?' <!--c-->':'')+'\n'+(i===0&&dir!=='right'?'<!--layout:'+dir+'-->\n':'')+(i===0&&styleStr()?'<!--style:'+styleStr()+'-->\n':'')+'\n';
 (function w(n,d){for(const c of n.children){o+='  '.repeat(d)+'- '+c.text+(c.collapsed&&c.children.length?' <!--c-->':'')+'\n';w(c,d+1)}})(r,0);
  return i<t.children.length-1?o.replace(/\n\n$/,'\n'):o}).join('\n')} /* bloki rozdziela dokładnie jedna pusta linia */
function parse(md){const t=forest([]);let st=null;dir='right';ST=JSON.parse(JSON.stringify(DEF));stDirty=true;
 for(let l of md.replace(/\t/g,'  ').split(/\r?\n/)){
  let m;
  if(m=/^#\s+(.*)$/.exec(l)){const r=mk(m[1].replace(C_RE,''));r.collapsed=C_RE.test(m[1]);t.children.push(r);st=[r];continue}
  if(m=/^<!--layout:(\w+)-->/.exec(l)){dir=m[1];continue}
  if(m=/^<!--style:(.*)-->\s*$/.exec(l)){try{const o=JSON.parse(m[1]);for(const k in DEF)if(k in o)ST[k]=o[k]}catch(e){}continue}
  if(m=/^(\s*)[-*+]\s+(.*)$/.exec(l)){
   if(!st){const r=mk('Mapa');t.children.push(r);st=[r]}
   let d=Math.min(Math.floor(m[1].length/2),st.length-1),x=m[2];
   const n=mk(x.replace(C_RE,''));n.collapsed=C_RE.test(x);st[d].children.push(n);st.length=d+1;st.push(n)}}
 if(!t.children.length)t.children.push(mk('Mapa'));return t}
function selfTest(){const a=serialize(root),b=serialize(parse(a));return a===b}
/* ---- stan ---- */
let root=parse('# Mapa myśli\n\n- Pomysł A\n  - Szczegół 1\n  - Szczegół 2\n- Pomysł B\n  - Szczegół 3\n- Pomysł C\n'),sel=root.children[0].children[0].id;
let mode='NORMAL',undoS=[],redoS=[],yank=null,cnt=0,pend='',tx=60,ty=0,k=1,editing=null,edId=0,hits=[],hi=0,fh=null,dirty=false,timer=null,menuOpen=false,tv=false;
const find=(id,n=root,p=null)=>n.id===id?{n,p}:n.children.reduce((r,c)=>r||find(id,c,n),null);
const S=()=>sel?find(sel):null;
/* operacje na węźle bez zaznaczenia: komunikat zamiast błędu */
const need=()=>{const f=S();if(!f)info('najpierw zaznacz węzeł');return f};
function deselect(){if(editing)endEdit();if(!sel)return;sel=0;render(true);info('odznaczono')}
const first=()=>root.children[0];
const vis=(n=root,a=[])=>{if(!n.top)a.push(n);if(!n.collapsed)n.children.forEach(c=>vis(c,a));return a};
const clone=n=>({id:++uid,text:n.text,collapsed:n.collapsed,children:n.children.map(clone)});
const snapStr=()=>JSON.stringify({root,sel,st:ST});
function snap(){undoS.push(snapStr());if(undoS.length>300)undoS.shift();redoS=[]}
function restore(s){const o=JSON.parse(s);root=o.root;sel=o.sel;if(o.st){ST=o.st;stDirty=true;syncSide()}}
function undo(){if(editing)endEdit();if(!undoS.length)return info('nic do cofnięcia');redoS.push(snapStr());restore(undoS.pop());changed()}
function redo(){if(editing)endEdit();if(!redoS.length)return info('nic do ponowienia');undoS.push(snapStr());restore(redoS.pop());changed()}
function info(t){$('info').textContent=t}
function hint(t){$('hint').textContent=t}
function setMode(m){mode=m;$('mode').textContent=m}
/* ---- ikony (SVG 24×24, kreska w kolorze tekstu) ---- */
const IC={open:'M3 7h6l2 2h10v10H3z',save:'M5 3h11l3 3v15H5z M8 3v5h8V3 M8 14h8v7H8z',undo:'M9 14L4 9l5-5 M4 9h10a6 6 0 010 12h-3',redo:'M15 14l5-5-5-5 M20 9H10a6 6 0 000 12h3',
 more:'M5 12h.01 M12 12h.01 M19 12h.01',fit:'M4 9V4h5 M20 9V4h-5 M4 15v5h5 M20 15v5h-5',edit:'M4 20h4L19 9l-4-4L4 16z M14 6l4 4',
 child:'M3 9h7v6H3z M10 12h5 M18 9v6 M15 12h6',sibdown:'M6 3h12v6H6z M12 13v8 M8 17h8',sibup:'M6 15h12v6H6z M12 3v8 M8 7h8',
 del:'M4 7h16 M9 7V4h6v3 M6 7l1 13h10l1-13 M10 11v6 M14 11v6',copy:'M8 8h12v12H8z M4 16V4h12',cut:'M6 7a3 3 0 100-.01 M6 20a3 3 0 100-.01 M8 8l12 10 M8 16L20 6',
 paste:'M9 3h6v4H9z M7 5H5v16h14V5h-2',fold:'M6 9l6 6 6-6',unfold:'M9 6l6 6-6 6',indent:'M4 5h16 M11 12h9 M11 19h9 M4 9l4 3-4 3',outdent:'M4 5h16 M11 12h9 M11 19h9 M8 9l-4 3 4 3',
 up:'M12 19V5 M6 11l6-6 6 6',emoji:'M12 21a9 9 0 100-18 9 9 0 000 18z M8 14s1.5 2 4 2 4-2 4-2 M9 9.5h.01 M15 9.5h.01',sliders:'M4 6h9 M17 6h3 M15 4v4 M4 12h3 M11 12h9 M9 10v4 M4 18h11 M19 18h1 M17 16v4',close:'M6 6l12 12 M18 6L6 18',map:'M9 10h6v4H9z M15 12h2 M17 12c2 0 2-5 4-5 M17 12c2 0 2 5 4 5 M9 12H7 M7 12c-2 0-2-5-4-5 M7 12c-2 0-2 5-4 5',down:'M12 5v14 M6 13l6 6 6-6',text:'M6 3h9l4 4v14H6z M9 9h3 M9 13h7 M9 17h7',newmap:'M6 3h9l4 4v14H6z M12 10v7 M8.5 13.5h7',
 image:'M4 5h16v14H4z M4 15l5-5 5 5 3-3 3 3',theme:'M20 14A8 8 0 0110 4a8 8 0 1010 10z',help:'M12 21a9 9 0 100-18 9 9 0 000 18z M9.5 9.5a2.5 2.5 0 115 0c0 1.7-2.5 2-2.5 3.5 M12 17h.01',
 lright:['M3 12h4 M7 12c4 0 4-6 8-6h6 M7 12h14 M7 12c4 0 4 6 8 6h6'],lleft:['M3 12h4 M7 12c4 0 4-6 8-6h6 M7 12h14 M7 12c4 0 4 6 8 6h6','matrix(-1 0 0 1 24 0)'],
 lboth:['M9 12h6 M9 12c-3 0-3-6-6-6 M9 12c-3 0-3 6-6 6 M15 12c3 0 3-6 6-6 M15 12c3 0 3 6 6 6'],ldown:['M3 12h4 M7 12c4 0 4-6 8-6h6 M7 12h14 M7 12c4 0 4 6 8 6h6','rotate(90 12 12)']};
const icon=n=>{const v=IC[n],[d,t]=Array.isArray(v)?v:[v];return `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"${t?` transform="${t}"`:''}/></svg>`};
const LAY={right:['lright','w prawo'],left:['lleft','w lewo'],both:['lboth','na obie strony'],down:['ldown','w dół']};
/* ---- układ + render ---- */
